<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Servicing question workflow</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Servicing question workflow</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="workflow-boundary-title workflow-boundary-desc">
        <title id="workflow-boundary-title">Servicing question workflow</title>
        <desc id="workflow-boundary-desc">A customer question moves through classify, draft, and a code router that delivers a supported answer, opens the one representative gate, or shows the technical-issue notice. Approved articles may be cited. Loan mocks may be searched and may not be cited. Live servicing systems stop outside the workflow. The representative who records approval is the sender.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="960" height="600" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="264" y="40" width="272" height="416" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="352" y="44" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="400" y="53" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">WORKFLOW</text>

        <rect x="560" y="136" width="360" height="232" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="692" y="140" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="740" y="149" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">FIXTURES</text>

        <!-- Arrows before nodes -->
        <path d="M 240,104 H 288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 392,136 V 168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 392,232 V 264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 392,328 V 368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 288,400 H 240" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M 392,432 V 460 Q 392,468 384,468 H 56 Q 48,468 48,460 V 112 Q 48,104 56,104 H 80" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 496,188 H 580" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 580,216 H 532 Q 524,216 524,224 V 288 Q 524,296 516,296 H 496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 580,284 H 556 Q 548,284 548,276 V 228 Q 548,220 540,220 H 496" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <path d="M 752,76 H 556" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <path d="M 548,68 V 84" fill="none" stroke="#2d3142" stroke-width="1.2"/>

        <!-- Arrow labels -->
        <rect x="248" y="84" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="264" y="93" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ASK</text>

        <rect x="248" y="380" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="266" y="389" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">GATE</text>

        <rect x="58" y="252" width="78" height="12" rx="2" fill="#f5f5f5"/>
        <text x="97" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SUPPORTED</text>
        <rect x="66" y="284" width="62" height="12" rx="2" fill="#f5f5f5"/>
        <text x="97" y="293" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">FR-11</text>

        <rect x="508" y="168" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="534" y="177" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SEARCH</text>

        <rect x="478" y="248" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="496" y="257" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CITE</text>

        <rect x="620" y="56" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="650" y="65" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BLOCKED</text>

        <!-- Customer -->
        <rect x="80" y="72" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="72" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="88" y="80" width="36" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="106" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
        <text x="160" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Customer</text>
        <text x="160" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">One question</text>

        <!-- Representative (focal) -->
        <rect x="80" y="360" width="160" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="360" width="160" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="88" y="368" width="44" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="110" y="377" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HUMAN</text>
        <text x="160" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Representative</text>
        <text x="160" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Approves and sends</text>

        <!-- Workflow API -->
        <rect x="288" y="72" width="208" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="72" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="296" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="310" y="89" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="392" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Workflow API</text>
        <text x="392" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Role checked in code</text>

        <!-- Classify -->
        <rect x="288" y="168" width="208" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="168" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="296" y="176" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="318" y="185" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
        <text x="392" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Classify</text>
        <text x="392" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Records the reason set</text>

        <!-- Draft -->
        <rect x="288" y="264" width="208" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="264" width="208" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="296" y="272" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="318" y="281" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
        <text x="392" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Draft</text>
        <text x="392" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Claims checked in code</text>

        <!-- Router (focal) -->
        <rect x="288" y="368" width="208" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="368" width="208" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="296" y="376" width="36" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="314" y="385" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RULE</text>
        <text x="392" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Router</text>
        <text x="392" y="420" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Deliver, gate, or FR-11</text>

        <!-- Approved articles -->
        <rect x="580" y="168" width="320" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="580" y="168" width="320" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="588" y="176" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="608" y="185" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
        <text x="740" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Approved articles</text>
        <text x="740" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Fixture library</text>

        <!-- Loan mocks -->
        <rect x="580" y="268" width="320" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="580" y="268" width="320" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="588" y="276" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="606" y="285" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">MOCK</text>
        <text x="740" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Loan mocks</text>
        <text x="740" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Searchable, not citable</text>

        <!-- Live systems, stopped -->
        <rect x="752" y="48" width="168" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="752" y="48" width="168" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="760" y="56" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="774" y="65" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SOR</text>
        <text x="836" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Live systems</text>
        <text x="836" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Not connected</text>

        <!-- Legend -->
        <line x1="40" y1="496" x2="920" y2="496" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="532" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="60" y="541" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Router and gate</text>

        <rect x="180" y="532" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="200" y="541" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Workflow step</text>

        <rect x="320" y="532" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="340" y="541" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Approved store</text>

        <rect x="460" y="532" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="480" y="541" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Search only</text>

        <line x1="590" y1="537" x2="618" y2="537" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <path d="M 618,531 V 543" fill="none" stroke="#2d3142" stroke-width="1.2"/>
        <text x="628" y="541" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Live system stopped</text>
      </svg>
    </div>
  </div>
</body>
</html>
